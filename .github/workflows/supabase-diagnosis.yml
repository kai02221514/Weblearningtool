name: Supabase Diagnosis

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.65.5

      - name: Start local Supabase
        run: supabase start > /dev/null

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Test grants and row-level security
        run: supabase test db

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: Test diagnosis API with synthetic users
        run: npm run test:diagnosis-api

      - name: Stop local Supabase
        if: always()
        run: supabase stop
